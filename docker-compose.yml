services:
  db:
    image: mysql:8.0.45
    restart: always
    env_file:
      - .env
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: redis_broker
    restart: always
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - redis_data:/data

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: always
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
      - ./docker/ollama/entrypoint.sh:/entrypoint.sh:ro
    env_file:
      - .env
    environment:
      OLLAMA_HOST: "0.0.0.0"
    entrypoint: ["sh", "/entrypoint.sh"]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    entrypoint: ["sh", "/app/entrypoint.sh"]
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      OLLAMA_API_URL: "http://ollama:11434/api/generate"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      ollama:
        condition: service_started

  celery_worker:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: celery_worker
    command: celery -A jobboard worker --loglevel=info -Q default,ai,email --concurrency=4 --max-tasks-per-child=100
    volumes:
      - ./backend:/app
    env_file:
      - .env
    environment:
      OLLAMA_API_URL: "http://ollama:11434/api/generate"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      ollama:
        condition: service_started

  frontend:
    build: ./frontend
    container_name: react_frontend
    env_file:
      - .env
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules

  frontend-e2e:
    profiles: ["e2e"]
    build: ./frontend
    command: npx playwright test
    environment:
      VITE_ENABLE_DEMO_MODE: "false"
      E2E_API_BASE_URL: "http://backend:8000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      redis:
        condition: service_healthy
      backend:
        condition: service_started

volumes:
  mysql_data:
  ollama_data:
  redis_data: